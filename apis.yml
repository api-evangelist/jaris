name: Jaris
description: >-
  Jaris is an embedded-finance infrastructure company that lets payment
  processors, ISOs, payment service providers, and SaaS platforms embed and
  launch a suite of financial products through a single integration. Jaris is
  not a bank; deposits are held and loans are issued through First Internet Bank
  of Indiana (FDIC member). Its three integrated offerings are Business Loans
  with same-day funding, Instant Payouts giving merchants early access to earned
  revenue, and Banking Services (deposit accounts). Supporting capabilities
  include intelligent merchant onboarding with automated KYB/KYC, managed
  settlements with real-time control across payment processors, and white-labeled
  embeddable UI components (Jaris Connect / Jaris UI). Developers integrate via an
  API-key model generated in the Jaris Dashboard, embedding a brandable UI in a
  few lines of JavaScript. The public developer reference is hosted on a
  password-gated ReadMe portal, so no machine-readable OpenAPI is available.
